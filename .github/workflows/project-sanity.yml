name: Project sanity

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repository-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository structure and configuration
        run: python scripts/validate_project.py
